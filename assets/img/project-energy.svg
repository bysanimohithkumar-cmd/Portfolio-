<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="engBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="rollerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#engBg)"/>

  <!-- Road & Speed Breaker Base -->
  <g transform="translate(60, 60)">
    <!-- Road Base -->
    <rect x="0" y="160" width="480" height="40" fill="#334155"/>
    <line x1="0" y1="160" x2="480" y2="160" stroke="#64748B" stroke-width="4"/>
    
    <!-- Speed Breaker Hump Structure -->
    <path d="M140 160 Q240 80 340 160 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/>

    <!-- Embedded Rolling Cylinders -->
    <circle cx="210" cy="140" r="22" fill="url(#rollerGrad)" stroke="#1E293B" stroke-width="2"/>
    <circle cx="210" cy="140" r="6" fill="#10B981"/>
    
    <circle cx="270" cy="140" r="22" fill="url(#rollerGrad)" stroke="#1E293B" stroke-width="2"/>
    <circle cx="270" cy="140" r="6" fill="#10B981"/>

    <!-- Dynamic rotational arrows -->
    <path d="M195 125 A 18 18 0 0 1 225 125" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <polygon points="228,125 224,120 220,126" fill="#10B981"/>

    <path d="M255 125 A 18 18 0 0 1 285 125" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <polygon points="288,125 284,120 280,126" fill="#10B981"/>

    <!-- Dynamo / Generator Unit -->
    <rect x="360" y="130" width="70" height="48" rx="8" fill="#1E293B" stroke="#059669" stroke-width="2"/>
    <text x="395" y="158" fill="#34D399" font-family="monospace" font-size="11" text-anchor="middle" font-weight="700">DYNAMO</text>
    
    <!-- Shaft connection line -->
    <line x1="292" y1="140" x2="360" y2="150" stroke="#10B981" stroke-width="3" stroke-dasharray="4,3"/>

    <!-- Energy output visualization / lightning bolts -->
    <g transform="translate(390, 80)">
      <polygon points="10,0 2,16 9,16 6,28 18,12 11,12" fill="#F59E0B" filter="drop-shadow(0 2px 4px rgba(245,158,11,0.4))"/>
    </g>
  </g>

  <!-- Tag Label -->
  <g transform="translate(40, 40)">
    <rect width="250" height="32" rx="6" fill="#FFFFFF" opacity="0.9" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <circle cx="20" cy="16" r="5" fill="#10B981"/>
    <text x="35" y="21" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">POWER GENERATION &bull; ROLLING</text>
  </g>
</svg>