      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p4Bg)"/>
  <g transform="translate(60, 40)">
    <rect width="480" height="280" rx="10" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.12))"/>
    <!-- Window Bar -->
    <rect width="480" height="34" rx="10" fill="#0F172A"/>
    <rect y="24" width="480" height="10" fill="#0F172A"/>
    <circle cx="20" cy="17" r="5" fill="#EF4444"/>
    <circle cx="36" cy="17" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="17" r="5" fill="#10B981"/>
    <text x="75" y="21" fill="#94A3B8" font-family="monospace" font-size="11">bash ~/algo-visualizer/main.py</text>
    
    <!-- Terminal Lines -->
    <text x="24" y="65" fill="#38BDF8" font-family="monospace" font-size="13">$ git clone https://github.com/developer/algo-viz.git</text>
    <text x="24" y="90" fill="#A7F3D0" font-family="monospace" font-size="13">✔ Repositories indexed [24 files, 1.4k lines]</text>
