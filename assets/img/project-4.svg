    <!-- Code block visualization -->
    <rect x="24" y="135" width="430" height="110" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="40" y="165" fill="#F472B6" font-family="monospace" font-size="12">def</text>
    <text x="70" y="165" fill="#60A5FA" font-family="monospace" font-size="12">dijkstra_shortest_path</text>
    <text x="240" y="165" fill="#E2E8F0" font-family="monospace" font-size="12">(graph, start):</text>
    <text x="60" y="190" fill="#94A3B8" font-family="monospace" font-size="12">distances = {node: float("inf") for node in graph}</text>
    <text x="60" y="210" fill="#94A3B8" font-family="monospace" font-size="12">pq = PriorityQueue([(0, start)])</text>
    <text x="60" y="230" fill="#34D399" font-family="monospace" font-size="12">return optimal_path(distances)</text>
