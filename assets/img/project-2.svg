<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p2Bg)"/>
  <g transform="translate(60, 40)">
    <rect width="480" height="280" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.06))"/>
    <!-- Window Bar -->
    <rect width="480" height="38" rx="10" fill="#F8FAFC"/>
    <rect y="28" width="480" height="10" fill="#F8FAFC"/>
    <line x1="0" y1="38" x2="480" y2="38" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="24" cy="19" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="40" cy="19" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="56" cy="19" r="5" fill="#10B981" opacity="0.8"/>
    <rect x="90" y="10" width="180" height="18" rx="6" fill="#EDF2F7"/>

    <!-- Neural / Graph Nodes visualization -->
    <g transform="translate(40, 60)">
      <!-- Layer 1 -->
      <circle cx="50" cy="40" r="14" fill="#7C3AED" opacity="0.9"/>
      <circle cx="50" cy="100" r="14" fill="#7C3AED" opacity="0.9"/>
      <circle cx="50" cy="160" r="14" fill="#7C3AED" opacity="0.9"/>
      <!-- Layer 2 -->
      <circle cx="160" cy="20" r="12" fill="#8B5CF6"/>
      <circle cx="160" cy="70" r="12" fill="#8B5CF6"/>
      <circle cx="160" cy="130" r="12" fill="#8B5CF6"/>
      <circle cx="160" cy="180" r="12" fill="#8B5CF6"/>
      <!-- Layer 3 -->
      <circle cx="270" cy="50" r="12" fill="#A78BFA"/>
      <circle cx="270" cy="110" r="12" fill="#A78BFA"/>
      <circle cx="270" cy="160" r="12" fill="#A78BFA"/>
      <!-- Layer 4 Output -->
      <circle cx="370" cy="100" r="16" fill="#6D28D9"/>

      <!-- Connecting Lines -->
      <line x1="50" y1="40" x2="160" y2="20" stroke="#DDD6FE" stroke-width="1.5"/>
      <line x1="50" y1="40" x2="160" y2="70" stroke="#DDD6FE" stroke-width="1.5"/>
      <line x1="50" y1="100" x2="160" y2="70" stroke="#DDD6FE" stroke-width="1.5"/>
      <line x1="50" y1="100" x2="160" y2="130" stroke="#DDD6FE" stroke-width="1.5"/>
      <line x1="50" y1="160" x2="160" y2="130" stroke="#DDD6FE" stroke-width="1.5"/>
      <line x1="50" y1="160" x2="160" y2="180" stroke="#DDD6FE" stroke-width="1.5"/>
      <line x1="160" y1="70" x2="270" y2="50" stroke="#DDD6FE" stroke-width="1.5"/>
      <line x1="160" y1="70" x2="270" y2="110" stroke="#DDD6FE" stroke-width="1.5"/>
      <line x1="160" y1="130" x2="270" y2="110" stroke="#DDD6FE" stroke-width="1.5"/>
      <line x1="160" y1="130" x2="270" y2="160" stroke="#DDD6FE" stroke-width="1.5"/>
      <line x1="270" y1="50" x2="370" y2="100" stroke="#C4B5FD" stroke-width="2"/>
      <line x1="270" y1="110" x2="370" y2="100" stroke="#C4B5FD" stroke-width="2"/>
      <line x1="270" y1="160" x2="370" y2="100" stroke="#C4B5FD" stroke-width="2"/>
    </g>
  </g>
</svg>