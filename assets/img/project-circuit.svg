<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#cirBg)"/>

  <g transform="translate(60, 45)">
    <!-- CAD Simulation Window Frame -->
    <rect width="480" height="270" rx="10" fill="#0F172A" stroke="#334155" stroke-width="2" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.15))"/>
    
    <!-- Title Bar -->
    <rect width="480" height="34" rx="10" fill="#1E293B"/>
    <rect y="24" width="480" height="10" fill="#1E293B"/>
    <line x1="0" y1="34" x2="480" y2="34" stroke="#334155"/>
    <circle cx="20" cy="17" r="5" fill="#EF4444"/>
    <circle cx="36" cy="17" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="17" r="5" fill="#10B981"/>
    <text x="75" y="21" fill="#94A3B8" font-family="monospace" font-size="11">Cadence Virtuoso / MATLAB Waveform Simulator</text>

    <!-- Schematic Grid Area -->
    <g transform="translate(25, 55)">
      <!-- Logic Gates / Circuit Diagram -->
      <!-- AND Gate -->
      <path d="M40 30 H65 A20 20 0 0 1 65 70 H40 Z" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
      <line x1="20" y1="40" x2="40" y2="40" stroke="#38BDF8" stroke-width="2"/>
      <line x1="20" y1="60" x2="40" y2="60" stroke="#38BDF8" stroke-width="2"/>
      <line x1="85" y1="50" x2="120" y2="50" stroke="#38BDF8" stroke-width="2"/>

      <!-- NOT Gate -->
      <polygon points="120,38 120,62 145,50" fill="none" stroke="#A78BFA" stroke-width="2.5"/>
      <circle cx="149" cy="50" r="4" fill="none" stroke="#A78BFA" stroke-width="2"/>
      <line x1="153" y1="50" x2="190" y2="50" stroke="#A78BFA" stroke-width="2"/>

      <!-- Waveform Oscilloscope Output below -->
      <rect x="0" y="95" width="430" height="95" rx="6" fill="#020617" stroke="#1E293B"/>
      <!-- Grid lines -->
      <line x1="0" y1="142" x2="430" y2="142" stroke="#1E293B" stroke-dasharray="3,3"/>
      <line x1="107" y1="95" x2="107" y2="190" stroke="#1E293B" stroke-dasharray="3,3"/>
      <line x1="215" y1="95" x2="215" y2="190" stroke="#1E293B" stroke-dasharray="3,3"/>
      <line x1="322" y1="95" x2="322" y2="190" stroke="#1E293B" stroke-dasharray="3,3"/>

      <!-- Square Clock Wave -->
      <path d="M10 130 H40 V110 H70 V130 H100 V110 H130 V130 H160 V110 H190 V130 H220 V110 H250 V130 H280 V110 H310 V130 H340 V110 H370 V130 H400 V110" fill="none" stroke="#34D399" stroke-width="2"/>
      
      <!-- Analog Response Wave -->
      <path d="M10 170 Q 30 145, 55 170 T 100 170 T 145 170 T 190 170 T 235 170 T 280 170 T 325 170 T 370 170 T 415 170" fill="none" stroke="#F43F5E" stroke-width="2"/>

      <text x="12" y="112" fill="#34D399" font-family="monospace" font-size="10">CLK (Digital)</text>
      <text x="12" y="162" fill="#F43F5E" font-family="monospace" font-size="10">V_OUT (Analog)</text>
    </g>
  </g>

  <!-- Tag Label -->
  <g transform="translate(40, 40)">
    <rect width="260" height="32" rx="6" fill="#FFFFFF" opacity="0.9" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <circle cx="20" cy="16" r="5" fill="#7C3AED"/>
    <text x="35" y="21" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">CADENCE &bull; MATLAB &bull; CIRCUITS</text>
  </g>
</svg>