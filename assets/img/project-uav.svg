<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="uavBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="droneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#uavBg)"/>
  
  <!-- Grid radar overlay -->
  <g opacity="0.15" stroke="#2563EB" stroke-width="1">
    <circle cx="300" cy="180" r="140" fill="none"/>
    <circle cx="300" cy="180" r="90" fill="none"/>
    <circle cx="300" cy="180" r="40" fill="none"/>
    <line x1="160" y1="180" x2="440" y2="180"/>
    <line x1="300" y1="40" x2="300" y2="320"/>
  </g>

  <!-- UAV Graphic -->
  <g transform="translate(300, 180)">
    <!-- Drone Arms -->
    <line x1="-110" y1="-70" x2="110" y2="70" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <line x1="-110" y1="70" x2="110" y2="-70" stroke="#334155" stroke-width="8" stroke-linecap="round"/>

    <!-- Propellers blur circles -->
    <circle cx="-110" cy="-70" r="32" fill="#93C5FD" opacity="0.35"/>
    <circle cx="110" cy="-70" r="32" fill="#93C5FD" opacity="0.35"/>
    <circle cx="-110" cy="70" r="32" fill="#93C5FD" opacity="0.35"/>
    <circle cx="110" cy="70" r="32" fill="#93C5FD" opacity="0.35"/>

    <!-- Rotor Hubs -->
    <circle cx="-110" cy="-70" r="10" fill="#2563EB"/>
    <circle cx="110" cy="-70" r="10" fill="#2563EB"/>
    <circle cx="-110" cy="70" r="10" fill="#2563EB"/>
    <circle cx="110" cy="70" r="10" fill="#2563EB"/>

    <!-- Central Chassis -->
    <rect x="-45" y="-45" width="90" height="90" rx="18" fill="url(#droneBody)" stroke="#38BDF8" stroke-width="2.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.15))"/>
    
    <!-- Sensor Pod / Camera Eye -->
    <circle cx="0" cy="0" r="20" fill="#0284C7"/>
    <circle cx="0" cy="0" r="12" fill="#E0F2FE"/>
    <circle cx="0" cy="0" r="6" fill="#0369A1"/>

    <!-- LED / Emergency Beacon -->
    <circle cx="0" cy="-30" r="4" fill="#EF4444"/>
    <circle cx="-30" cy="0" r="3" fill="#10B981"/>
    <circle cx="30" cy="0" r="3" fill="#10B981"/>
  </g>

  <!-- Tag / Label -->
  <g transform="translate(40, 40)">
    <rect width="180" height="32" rx="6" fill="#FFFFFF" opacity="0.9" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <circle cx="20" cy="16" r="5" fill="#2563EB"/>
    <text x="35" y="21" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">TRINETRA UAV &bull; SURVIVAL</text>
  </g>
</svg>