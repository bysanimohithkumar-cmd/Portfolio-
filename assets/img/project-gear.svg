<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="gearBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#gearBg)"/>

  <g transform="translate(100, 50)">
    <!-- Rack and Pinion / Speed Breaker Plate -->
    <!-- Top Speed Breaker Plate -->
    <rect x="20" y="40" width="360" height="26" rx="6" fill="#475569" stroke="#1E293B" stroke-width="2"/>
    <text x="200" y="58" fill="#F8FAFC" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="700">VEHICLE IMPULSE PLATE</text>

    <!-- Downward Arrows -->
    <g stroke="#D97706" stroke-width="2.5" fill="none">
      <path d="M120 15 L120 35 M115 30 L120 35 L125 30"/>
      <path d="M200 15 L200 35 M195 30 L200 35 L205 30"/>
      <path d="M280 15 L280 35 M275 30 L280 35 L285 30"/>
    </g>

    <!-- Vertical Rack with Teeth -->
    <rect x="90" y="66" width="14" height="130" fill="#64748B" stroke="#334155" stroke-width="2"/>
    <!-- Rack teeth -->
    <rect x="104" y="80" width="8" height="6" fill="#475569"/>
    <rect x="104" y="100" width="8" height="6" fill="#475569"/>
    <rect x="104" y="120" width="8" height="6" fill="#475569"/>
    <rect x="104" y="140" width="8" height="6" fill="#475569"/>
    <rect x="104" y="160" width="8" height="6" fill="#475569"/>

    <!-- Large Spur Gear -->
    <g transform="translate(160, 130)">
      <circle cx="0" cy="0" r="42" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
      <circle cx="0" cy="0" r="14" fill="#94A3B8"/>
      <!-- Teeth -->
      <g stroke="#475569" stroke-width="5">
        <line x1="0" y1="-46" x2="0" y2="46"/>
        <line x1="-46" y1="0" x2="46" y2="0"/>
        <line x1="-32" y1="-32" x2="32" y2="32"/>
        <line x1="-32" y1="32" x2="32" y2="-32"/>
      </g>
      <circle cx="0" cy="0" r="28" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    </g>

    <!-- Step-up Pinion Gear -->
    <g transform="translate(240, 130)">
      <circle cx="0" cy="0" r="24" fill="#CBD5E1" stroke="#334155" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="#F59E0B"/>
      <!-- Connecting belt/mesh -->
      <line x1="-35" y1="0" x2="-24" y2="0" stroke="#F59E0B" stroke-width="2"/>
    </g>

    <!-- Flywheel & Generator -->
    <rect x="290" y="105" width="80" height="50" rx="8" fill="#1E293B" stroke="#D97706" stroke-width="2"/>
    <text x="330" y="135" fill="#FCD34D" font-family="monospace" font-size="11" text-anchor="middle" font-weight="700">GENERATOR</text>

    <!-- Shaft connecting -->
    <line x1="248" y1="130" x2="290" y2="130" stroke="#64748B" stroke-width="4"/>

    <!-- Output Meter -->
    <g transform="translate(180, 205)">
      <rect width="180" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="16" y="22" fill="#1E293B" font-family="monospace" font-size="12" font-weight="700">OUTPUT: 12.4V DC</text>
      <circle cx="160" cy="17" r="6" fill="#10B981"/>
    </g>
  </g>

  <!-- Tag Label -->
  <g transform="translate(40, 40)">
    <rect width="260" height="32" rx="6" fill="#FFFFFF" opacity="0.9" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <circle cx="20" cy="16" r="5" fill="#D97706"/>
    <text x="35" y="21" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">POWER GENERATION &bull; GEAR SYSTEM</text>
  </g>
</svg>