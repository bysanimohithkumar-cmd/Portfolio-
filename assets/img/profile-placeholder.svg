<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#avatarBg)"/>
  
  <!-- Subtle decorative technical circuit pattern -->
  <g opacity="0.25" stroke="#2563EB" stroke-width="2" fill="none">
    <path d="M40 80 H120 V140 H180"/>
    <circle cx="180" cy="140" r="4" fill="#2563EB"/>
    <path d="M360 320 H280 V260 H220"/>
    <circle cx="220" cy="260" r="4" fill="#2563EB"/>
    <path d="M340 80 H260 V120"/>
    <circle cx="260" cy="120" r="4" fill="#2563EB"/>
  </g>

  <!-- Person Silhouette -->
  <circle cx="200" cy="150" r="62" fill="#CBD5E1"/>
  <circle cx="200" cy="146" r="54" fill="#94A3B8"/>
  <path d="M90 330 C105 235, 295 235, 310 330 Z" fill="#64748B"/>
  
  <!-- Initials Badge Overlay -->
  <g transform="translate(200, 310)">
    <rect x="-65" y="-18" width="130" height="36" rx="18" fill="url(#badgeGrad)" filter="drop-shadow(0 4px 10px rgba(37,99,235,0.3))"/>
    <text x="0" y="5" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" text-anchor="middle" letter-spacing="1">B. MOHITH</text>
  </g>
</svg>